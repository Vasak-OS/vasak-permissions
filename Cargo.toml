# The three pieces share the D-Bus contract in `protocol`, so a change to a
# message cannot be applied to one side and forgotten on the other.
[workspace]
resolver = "2"
members = ["protocol", "daemon", "src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["Vasak Group", "Joaquin (Pato) Decima"]
license = "MIT"

[workspace.dependencies]
vasak-permissions-protocol = { path = "protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The `tokio` feature makes zbus run interface methods on the Tokio runtime.
# Without it they execute on zbus's own executor, where anything from
# `tokio::time` panics with "there is no reactor running" — which took the
# whole connection down the first time the service tried to time out a dialog.
zbus = { version = "5", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
