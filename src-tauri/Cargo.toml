[package]
name = "vasak-permissions-agent"
description = "VasakOS permission dialog agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "vasak_permissions_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vasak-permissions-agent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vasak-permissions-protocol.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-vicons = "2"
tauri-plugin-config-manager = "2"
tauri-plugin-i18n-vsk = "2.3.0"
serde.workspace = true
serde_json.workspace = true
zbus.workspace = true
tokio.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

[dev-dependencies]
# `test` da `tauri::test::mock_app`, que hace un AppHandle sin ventana ni
# sesión gráfica. Es lo único que falta para poder construir el backend en una
# prueba y mirar la firma que expone por el bus.
tauri = { version = "2", features = ["test"] }
