# Los chequeos viven en el repositorio `.github` de la organización, así que
# acá sólo se los llama. Cambiarlos es cambiarlos en un solo lugar.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    # Sólo lectura, que es todo lo que estos chequeos necesitan: clonan,
    # instalan dependencias y comprueban. El workflow llamado declara lo mismo
    # —es donde corre el trabajo y donde el permiso importa— y esto pone el
    # techo desde acá: un llamado no puede pedir más de lo que el llamador le da.
    permissions:
      contents: read
    uses: Vasak-OS/.github/.github/workflows/app.yml@main
    # Sólo el token de SonarQube Cloud, y por nombre: `secrets: inherit`
    # le daría también el de crates.io y el de npm a un trabajo que
    # instala dependencias de terceros.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      # Este repositorio ya está al día con las bibliotecas propias, así
      # que quedarse atrás pasa a cortar en vez de sólo avisar.
      bibliotecas_cortan: true
      # Y el candado también. La línea de arriba decía «ya está al día» siendo
      # falso: el rango pedía `^1.0.0` —que admite la 1.4.0— y `bun.lock` se
      # había quedado en la 1.0.0, así que se empaquetaba ésa con el CI en
      # verde. Ahora que la comprobación existe (Vasak-OS/.github#7), se
      # enciende acá. Para este repositorio es **la** protección: no usa ningún
      # componente que haya cambiado, así que lo único que puede pasarle es
      # quedarse atrás otra vez sin que nada lo diga.
      candado_corta: true
      # El daemon y el protocolo no dependen de Tauri, así que sus pruebas
      # corren en un runner pelado. Entre ellas están las de propiedad sobre
      # los analizadores que leen el registro del kernel — que es entrada que
      # elige, en parte, el programa al que se está bloqueando.
      pruebas_rust: -p vasak-permissions-daemon -p vasak-permissions-protocol
