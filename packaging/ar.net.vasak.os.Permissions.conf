<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the name: the service is the authority on who may use
       the camera, the microphone and the user's accounts, so a program that
       could claim the name would answer those questions itself. -->
  <policy user="root">
    <allow own="ar.net.vasak.os.Permissions"/>
  </policy>

  <!-- Anyone may ask. Asking is the whole point, and every method decides for
       itself what the caller is entitled to: CheckPermission consults the
       stored policy, the management methods go through polkit, and
       RegisterAgent only accepts the installed agent binary. -->
  <policy context="default">
    <allow send_destination="ar.net.vasak.os.Permissions"
           send_interface="ar.net.vasak.os.Permissions"/>
    <allow send_destination="ar.net.vasak.os.Permissions"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="ar.net.vasak.os.Permissions"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
